<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Clock</title>

    <style>

        *{

        margin:0;

        padding:0;

        box-sizing:border-box;

        font-family:Poppins,sans-serif;

        }

        body{

        display:flex;

        justify-content:center;

        align-items:center;

        height:100vh;

        background:#ffffff;

        }

        .clock{

        text-align:center;

        }

        #time{

        font-size:30px;

        font-weight:700;

        color:#2563eb;

        }

        #date{

        margin-top:10px;

        font-size:16px;

        color:#555;

        }

    </style>

</head>

<body>

<div class="clock">

    <div id="time"></div>

    <div id="date"></div>

</div>

<script>

    function updateClock(){

    const now=new Date();

    document.getElementById("time").innerHTML=

    now.toLocaleTimeString();

    document.getElementById("date").innerHTML=

    now.toDateString();

    }

    updateClock();

    setInterval(updateClock,1000);

</script>

</body>

</html>
