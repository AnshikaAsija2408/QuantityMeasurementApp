<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>History</title>

    <style>

        *{

            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Poppins,sans-serif;

        }

        body{

            padding:20px;
            background:#ffffff;

        }

        h2{

            color:#2563eb;
            margin-bottom:15px;

        }

        ul{

            list-style:none;

        }

        li{

            background:#f4f7ff;
            padding:12px;
            margin-bottom:10px;
            border-left:5px solid #2563eb;
            border-radius:8px;

        }

        .empty{

            color:gray;
            text-align:center;

        }

    </style>

</head>

<body>

<h2>Calculation History</h2>

<ul id="historyList"></ul>

<script>

    function loadHistory(){

        const list=document.getElementById("historyList");

        const history=JSON.parse(localStorage.getItem("history")) || [];

        list.innerHTML="";

        if(history.length===0){

            list.innerHTML="<p class='empty'>No Calculations Yet</p>";

            return;

        }

        history.forEach(item=>{

list.innerHTML += `

<div class="history-card">

<pre>${item}</pre>

</div>

`;

});

    }

    loadHistory();

    window.addEventListener("storage",loadHistory);

    setInterval(loadHistory,1000);

</script>

</body>

</html>
